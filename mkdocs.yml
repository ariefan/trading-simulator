# Trading Simulator Documentation
site_name: Trading Simulator
site_description: An educational forex trading simulator to test strategies and learn why most don't work
site_url: https://trading-simulator.example.com
repo_url: https://github.com/ariefan/trading-simulator
repo_name: ariefan/trading-simulator

# Theme configuration
theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.svg
  favicon: assets/favicon.ico

# Plugins
plugins:
  - search
  - minify:
      minify_html: true

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: ariefan
      repo: trading-simulator
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - Introduction: getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - guides/index.md
    - Paper Trading: guides/paper-trading.md
    - Backtesting: guides/backtesting.md
    - Custom Strategies: guides/custom-strategies.md
    - AI Assistant: guides/ai-assistant.md
  - API Reference:
    - api-reference/index.md
    - Authentication: api-reference/authentication.md
    - Market Data: api-reference/market.md
    - Trading: api-reference/trading.md
    - Portfolio: api-reference/portfolio.md
    - Backtesting: api-reference/backtesting.md
    - AI & Signals: api-reference/ai-signals.md
  - Deployment:
    - deployment/index.md
    - Docker: deployment/docker.md
    - Production: deployment/production.md

# Extra configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ariefan/trading-simulator
  generator: false

