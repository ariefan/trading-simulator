[project]
name = "trading-simulator-api"
version = "0.1.0"
description = "Forex Trading Simulator API with backtesting engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.125.0",
    "uvicorn[standard]>=0.39.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.7.0",
    "celery>=5.5.0",
    "redis>=7.1.0",
    "numpy>=2.2.0",
    "pandas>=2.3.0",
    "httpx>=0.28.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5.0",
    "transformers>=4.47.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "pypfopt>=1.5.5",
    "scipy>=1.15.0",
    "scikit-learn>=1.6.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
